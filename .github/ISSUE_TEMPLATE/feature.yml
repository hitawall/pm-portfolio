name: Feature
description: New functionality or enhancement
labels: ["type:feature"]
body:
  - type: input
    id: summary
    attributes:
      label: What
      description: One sentence — what are we building?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Motivation — recruiter impact, UX gap, phase requirement
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Bullet list of acceptance criteria
      placeholder: |
        - [ ] Route /foo renders at 375px and 1440px
        - [ ] npm run build passes
        - [ ] Dark mode correct
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — critical
        - P1 — high
        - P2 — medium
        - P3 — low
    validations:
      required: true
